name: Build and test

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  abi:
    name: "Check ABI"
    runs-on: ubuntu-latest
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Binary Compatibility Validation
        run: ./gradlew checkKotlinAbi --scan

  ktlint:
    name: "Run Ktlint"
    runs-on: ubuntu-latest
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Run Ktlint
        run: ./gradlew ktlintCheck --scan

  test:
    runs-on: "ubuntu-latest"
    name: Run unit tests
    needs: [abi, ktlint]
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Run unit tests tests
        run: ./gradlew test --scan

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotest-html-report
          path: build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Kotest Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit